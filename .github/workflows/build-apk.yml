name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: apk-build-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          echo "Using sdkmanager: $SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare named APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SeongSamgukjiLauncher-v0.1.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SeongSamgukjiLauncher-v0.1-debug
          path: SeongSamgukjiLauncher-v0.1.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            gh release upload v0.1.0 SeongSamgukjiLauncher-v0.1.apk --clobber
          else
            gh release create v0.1.0 SeongSamgukjiLauncher-v0.1.apk               --title "성삼국지 촉한영걸전 Android Launcher v0.1"               --notes "Winlator 계열을 이용해 성삼국지 촉한영걸전 Windows 바로가기를 Android에서 실행하는 테스트용 런처입니다. 게임 원본 데이터는 포함하지 않습니다."
          fi

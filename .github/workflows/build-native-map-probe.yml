name: Build Native Android Map Probe

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "native/android-map-probe/**"
      - ".github/workflows/build-native-map-probe.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract private map and unit assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native/android-map-probe/app/src/main/assets/map
          mkdir -p native/android-map-probe/app/src/main/assets/sprites

          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/573647280" \
            -o /tmp/game2.zip

          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/573646841" \
            -o /tmp/game1.zip

          python3 - <<'PY'
          import pathlib, struct, zipfile

          assets=pathlib.Path('native/android-map-probe/app/src/main/assets')

          with zipfile.ZipFile('/tmp/game2.zip') as z:
              data=z.read('map/m000.jpg')
          (assets/'map'/'m000.jpg').write_bytes(data)
          print('m000.jpg bytes=',len(data))

          with zipfile.ZipFile('/tmp/game1.zip') as z:
              data=z.read('Unit_mov.e5')

          # Ls12 container: 12-byte big-endian descriptors begin at 0x110.
          # Each descriptor is (uncompressed_size, stored_size, absolute_offset).
          unpacked, stored, offset = struct.unpack_from('>III', data, 0x110)
          expected = 48 * 48 * 11
          if unpacked != expected or stored < expected:
              raise SystemExit(f'Unexpected Unit_mov record: unpacked={unpacked} stored={stored} offset={offset}')
          payload=data[offset:offset+expected]
          if len(payload) != expected:
              raise SystemExit('Unit_mov payload truncated')
          (assets/'sprites'/'unit_mov_000.bin').write_bytes(payload)
          print('Unit_mov record0=',unpacked,stored,offset,'payload=',len(payload))

          with zipfile.ZipFile('/tmp/game1.zip') as z:
              spc=z.read('Unit_spc.e5')
              palfile=z.read('Spalet.e5')

          spc_unpacked, spc_stored, spc_offset = struct.unpack_from('>III', spc, 0x110)
          spc_expected = 48 * 48 * 5
          if spc_unpacked != spc_expected or spc_stored < spc_expected:
              raise SystemExit(f'Unexpected Unit_spc record: {spc_unpacked}/{spc_stored}/{spc_offset}')
          (assets/'sprites'/'unit_spc_000.bin').write_bytes(
              spc[spc_offset:spc_offset+spc_expected])

          pal_unpacked, pal_stored, pal_offset = struct.unpack_from('>III', palfile, 0x110)
          if pal_unpacked != 768 or pal_stored < 768:
              raise SystemExit(f'Unexpected Spalet record: {pal_unpacked}/{pal_stored}/{pal_offset}')
          palette=palfile[pal_offset:pal_offset+768]
          if len(palette) != 768:
              raise SystemExit('Spalet palette truncated')
          (assets/'sprites'/'spalet_000.bin').write_bytes(palette)
          print('Unit_spc record0=',spc_unpacked,spc_stored,spc_offset)
          print('Spalet palette0=',pal_unpacked,pal_stored,pal_offset)
          PY

      - name: Build native map probe APK
        working-directory: native/android-map-probe
        run: gradle --no-daemon :app:assembleDebug

      - name: Publish private draft APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="native/android-map-probe/app/build/outputs/apk/debug/app-debug.apk"
          OUT="SeongSamgukji-Native-MapProbe-v0.3.apk"
          cp "$APK" "$OUT"
          if gh release view native-map-probe-v0.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload native-map-probe-v0.3 "$OUT" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create native-map-probe-v0.3 "$OUT" --draft               --title "PRIVATE - 성삼국지 Native Map Probe v0.3"               --notes "Winlator/Wine 없이 실제 m000.jpg, Unit_mov.e5, Unit_spc.e5, Spalet.e5를 Android에서 직접 읽는 네이티브 프로토타입입니다. Spalet의 256색 RGB 팔레트를 적용해 원본 S형상을 실제 색으로 렌더링하고, 맵 터치 이동/핀치 줌/드래그를 지원합니다. 공개 배포하지 마세요."               --repo "$GITHUB_REPOSITORY"
          fi

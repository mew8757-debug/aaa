name: Build Native Android Battle v0.9

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "native/android-map-probe/**"
      - "native/tools/build_s00_assets.py"
      - ".github/workflows/build-native-map-probe.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download original game data
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/573647280" \
            -o /tmp/game2.zip

          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/573646841" \
            -o /tmp/game1.zip

      - name: Build S00 combat assets
        shell: bash
        run: |
          set -euo pipefail
          python3 native/tools/build_s00_assets.py \
            /tmp/game1.zip \
            /tmp/game2.zip \
            native/android-map-probe/app/src/main/assets

      - name: Build native v0.9 APK
        working-directory: native/android-map-probe
        run: gradle --no-daemon :app:assembleDebug

      - name: Publish private draft APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="native/android-map-probe/app/build/outputs/apk/debug/app-debug.apk"
          OUT="SeongSamgukji-Native-Battle-v0.9.apk"
          cp "${APK}" "${OUT}"

          if gh release view native-battle-v0.9 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload native-battle-v0.9 "${OUT}" --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create native-battle-v0.9 "${OUT}" --draft \
              --title "PRIVATE - 성삼국지 Native Battle v0.9" \
              --notes "v0.7의 원본 Hexzmap 지형 이동과 S_00 오프닝을 유지하면서 첫 네이티브 물리 전투 루프를 추가했습니다. Data.e5의 인물 오능/초기 HP/직업 성장치와 S_00 46/47 배치 레벨을 이용해 전투 패널을 만들고, Unit_atk.e5 원본 64x64 12프레임 공격 모션을 사용합니다. 공격 범위 ID 0(십자 인접)/1(주변 1칸)은 확인된 의미대로 처리하며 그 밖의 확장 범위는 추측하지 않고 비활성화합니다. 현재 피해는 검증된 핵심 공방차 ATK-DEF만 적용하는 결정적 1차 구현이며 장비/지형 전투보정/명중/회피/치명타/연타/반격/AI는 후속 단계입니다. 공개 배포하지 마세요." \
              --repo "${GITHUB_REPOSITORY}"
          fi

      - name: Record v0.9 build status
        if: always()
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native/build-status

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          status = {
              "version": "0.9.0",
              "sourceCommit": os.environ["BUILD_SHA"],
              "status": os.environ["BUILD_STATUS"],
          }

          battle_path = Path("native/android-map-probe/app/src/main/assets/battle/battle0.json")
          if battle_path.exists():
              battle = json.loads(battle_path.read_text(encoding="utf-8"))
              status["combatModel"] = battle.get("combatModel")
              status["damageModel"] = battle.get("damageModel")
              status["supportedAttackRangeIds"] = battle.get("supportedAttackRangeIds", [])
              status["terrainIds"] = battle.get("terrainIds", [])
              status["playerProfiles"] = [
                  {
                      "characterId": unit.get("characterId"),
                      "name": unit.get("name"),
                      "jobId": unit.get("jobId"),
                      "jobFamily": unit.get("jobFamily"),
                      "movePoints": unit.get("movePoints"),
                      "attackRangeId": unit.get("attackRangeId"),
                      "level": unit.get("level"),
                      "baseLevel": unit.get("baseLevel"),
                      "deployLevel": unit.get("deployLevel"),
                      "hpMax": unit.get("hpMax"),
                      "attack": unit.get("attack"),
                      "defense": unit.get("defense"),
                  }
                  for unit in battle.get("units", [])
                  if unit.get("faction") == "player"
              ]
              status["visibleEnemyProfiles"] = [
                  {
                      "characterId": unit.get("characterId"),
                      "name": unit.get("name"),
                      "attackRangeId": unit.get("attackRangeId"),
                      "level": unit.get("level"),
                      "deployLevel": unit.get("deployLevel"),
                      "hpMax": unit.get("hpMax"),
                      "attack": unit.get("attack"),
                      "defense": unit.get("defense"),
                  }
                  for unit in battle.get("units", [])
                  if unit.get("faction") == "enemy" and unit.get("visible")
              ][:8]

          Path("native/build-status/v0.9.json").write_text(
              json.dumps(status, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/build-status/v0.9.json

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Record native v0.9 build status"
          git push

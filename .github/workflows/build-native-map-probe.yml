name: Build Native Android Battle v4.66

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "native/android-map-probe/**"
      - "native/tools/build_s00_assets.py"
      - ".github/workflows/build-native-map-probe.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download original game data
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/573647280" \
            -o /tmp/game2.zip

          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/573646841" \
            -o /tmp/game1.zip

      - name: Build S00 combat assets
        shell: bash
        run: |
          set -euo pipefail
          python3 native/tools/build_s00_assets.py \
            /tmp/game1.zip \
            /tmp/game2.zip \
            native/android-map-probe/app/src/main/assets

      - name: Build native v4.66 APK
        working-directory: native/android-map-probe
        run: gradle --no-daemon :app:assembleDebug

      - name: Publish private draft APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="native/android-map-probe/app/build/outputs/apk/debug/app-debug.apk"
          OUT="SeongSamgukji-Native-Battle-v4.66.apk"
          cp "${APK}" "${OUT}"

          if gh release view native-battle-v4.66 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload native-battle-v4.66 "${OUT}" --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create native-battle-v4.66 "${OUT}" --draft \
              --title "PRIVATE - 성삼국지 Native Battle v4.66" \
              --notes "Native v4.66은 v4.65에서 발견한 R_27/S_27을 실제 연결하기 전 S27의 적 유인 승리 조건을 원본 Scene2 변수/트리거에서 확정하는 probe입니다. R27 Scene13 출전 구조와 S27 route section을 compact status로 기록합니다. v4.64 R26→S26 연속 플레이는 유지합니다. 공개 배포하지 마세요." \
              --repo "${GITHUB_REPOSITORY}"
          fi

      - name: Record v4.66 build status
        if: always()
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native/build-status

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          status = {
              "version": "4.66.0",
              "sourceCommit": os.environ["BUILD_SHA"],
              "status": os.environ["BUILD_STATUS"],
              "turnLoop": True,
              "counterattacks": True,
              "enemyAi": "nearest-opponent-weighted-terrain-v1.0",
          }

          battle_path = Path("native/android-map-probe/app/src/main/assets/battle/battle0.json")
          if battle_path.exists():
              battle = json.loads(battle_path.read_text(encoding="utf-8"))
              status["combatModel"] = battle.get("combatModel")
              status["damageModel"] = battle.get("damageModel")
              status["supportedAttackRangeIds"] = battle.get("supportedAttackRangeIds", [])
              status["terrainIds"] = battle.get("terrainIds", [])

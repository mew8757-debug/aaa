name: Build Native Android Battle v0.6

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "native/android-map-probe/**"
      - "native/tools/build_s00_assets.py"
      - ".github/workflows/build-native-map-probe.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download original game data
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/573647280" \
            -o /tmp/game2.zip

          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/573646841" \
            -o /tmp/game1.zip

      - name: Build S00 native assets
        shell: bash
        run: |
          set -euo pipefail
          python3 native/tools/build_s00_assets.py \
            /tmp/game1.zip \
            /tmp/game2.zip \
            native/android-map-probe/app/src/main/assets

      - name: Build native v0.6 APK
        working-directory: native/android-map-probe
        run: gradle --no-daemon :app:assembleDebug

      - name: Publish private draft APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="native/android-map-probe/app/build/outputs/apk/debug/app-debug.apk"
          OUT="SeongSamgukji-Native-Battle-v0.6.apk"
          cp "${APK}" "${OUT}"

          if gh release view native-battle-v0.6 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload native-battle-v0.6 "${OUT}" --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create native-battle-v0.6 "${OUT}" --draft \
              --title "PRIVATE - 성삼국지 Native Battle v0.6" \
              --notes "Winlator/Wine 없이 원본 RS/S_00.eex의 첫 전투를 Android에서 직접 재생하는 통합 프로토타입입니다. 최신 S00 실제 배치와 Data.e5 한글 인물명, Ekd5.exe S형상 지정표, Unit_mov/Unit_spc/Spalet 원본 스프라이트를 유지하면서 원본 오프닝 대사·등장·이동·회전·동작·퇴각·지연·BGM/SFX 지시를 이벤트 순서대로 실행합니다. 현재 BGM/SFX는 이벤트 번호만 추적하며 실제 음원 재생과 전투 규칙/AI는 다음 단계입니다. 공개 배포하지 마세요." \
              --repo "${GITHUB_REPOSITORY}"
          fi

      - name: Record successful build
        env:
          BUILD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native/build-status
          printf '{"version":"0.6.0","sourceCommit":"%s","status":"success"}\n' "${BUILD_SHA}" \
            > native/build-status/v0.6.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/build-status/v0.6.json

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Record successful native v0.6 build"
          git push

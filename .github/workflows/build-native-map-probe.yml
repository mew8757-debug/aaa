name: Build Native Android Battle v0.7

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "native/android-map-probe/**"
      - "native/tools/build_s00_assets.py"
      - ".github/workflows/build-native-map-probe.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download original game data
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/573647280" \
            -o /tmp/game2.zip

          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/573646841" \
            -o /tmp/game1.zip

      - name: Build S00 terrain-aware assets
        shell: bash
        run: |
          set -euo pipefail
          python3 native/tools/build_s00_assets.py \
            /tmp/game1.zip \
            /tmp/game2.zip \
            native/android-map-probe/app/src/main/assets

      - name: Build native v0.7 APK
        working-directory: native/android-map-probe
        run: gradle --no-daemon :app:assembleDebug

      - name: Publish private draft APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="native/android-map-probe/app/build/outputs/apk/debug/app-debug.apk"
          OUT="SeongSamgukji-Native-Battle-v0.7.apk"
          cp "${APK}" "${OUT}"

          if gh release view native-battle-v0.7 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload native-battle-v0.7 "${OUT}" --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create native-battle-v0.7 "${OUT}" --draft \
              --title "PRIVATE - 성삼국지 Native Battle v0.7" \
              --notes "Winlator/Wine 없이 실행하는 네이티브 Android 전투 프로토타입입니다. v0.6의 원본 S_00 오프닝 이벤트와 실제 인물별 S형상을 유지하면서 Hexzmap.e5의 M000 지형 23x16, Data.e5의 상세병종 이동력과 병종계열별 30종 지형 이동비용을 적용합니다. 오프닝 종료 후 아군을 선택하면 실제 이동 가능 범위를 계산하고, 도달 가능한 빈 타일까지 최소 이동비용 경로로 이동합니다. 이동비용 0/255 및 지원되지 않는 지형은 통행 불가로 처리합니다. 공격/피해 계산/AI/실제 음원 재생은 다음 단계입니다. 공개 배포하지 마세요." \
              --repo "${GITHUB_REPOSITORY}"
          fi

      - name: Record v0.7 build status
        if: always()
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native/build-status

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          status = {
              "version": "0.7.0",
              "sourceCommit": os.environ["BUILD_SHA"],
              "status": os.environ["BUILD_STATUS"],
          }

          battle_path = Path("native/android-map-probe/app/src/main/assets/battle/battle0.json")
          terrain_path = Path("native/android-map-probe/app/src/main/assets/battle/terrain0.bin")

          if battle_path.exists():
              battle = json.loads(battle_path.read_text(encoding="utf-8"))
              status["terrainIds"] = battle.get("terrainIds", [])
              status["playerProfiles"] = [
                  {
                      "characterId": unit.get("characterId"),
                      "jobId": unit.get("jobId"),
                      "jobFamily": unit.get("jobFamily"),
                      "movePoints": unit.get("movePoints"),
                  }
                  for unit in battle.get("units", [])
                  if unit.get("faction") == "player"
              ]

          if terrain_path.exists():
              status["terrainCellCount"] = len(terrain_path.read_bytes())

          Path("native/build-status/v0.7.json").write_text(
              json.dumps(status, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/build-status/v0.7.json

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Record native v0.7 build status"
          git push

name: Build Native Android Map Probe

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "native/android-map-probe/**"
      - ".github/workflows/build-native-map-probe.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract S00 native battle assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ASSETS="native/android-map-probe/app/src/main/assets"
          rm -rf "$ASSETS"
          mkdir -p "$ASSETS/map" "$ASSETS/sprites" "$ASSETS/battle"

          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/573647280" \
            -o /tmp/game2.zip

          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/573646841" \
            -o /tmp/game1.zip

          python3 - <<'PY'
          import json, pathlib, struct, zipfile

          root=pathlib.Path('native/android-map-probe/app/src/main/assets')
          game1=zipfile.ZipFile('/tmp/game1.zip')
          game2=zipfile.ZipFile('/tmp/game2.zip')

          # Actual first tactical map.
          map_bytes=game2.read('map/m000.jpg')
          (root/'map'/'m000.jpg').write_bytes(map_bytes)

          data=game1.read('Data.e5')
          exe=game1.read('Ekd5.exe')
          mov=game1.read('Unit_mov.e5')
          spc=game1.read('Unit_spc.e5')
          pal=game1.read('Spalet.e5')
          s00=game1.read('RS/S_00.eex')

          # Guard against accidentally building with a different scenario revision.
          if len(s00) != 31318 or not s00.startswith(b'EEX'):
              raise SystemExit('Unexpected S_00.eex revision')

          def name_of(cid):
              raw=data[0x18c+cid*0x20:0x18c+cid*0x20+12]
              raw=raw.split(bytes([0]),1)[0]
              return raw.decode('cp949','replace').strip()

          def sprite_of(cid):
              return int.from_bytes(exe[0xD2800+cid*2:0xD2802+cid*2],'little')

          # Records decoded from the first S_00 deployment commands:
          # 0x4B = player slots, 0x46 = ally slots, 0x47 = enemy slots.
          player=[
              (0,0,3,2),
              (1,0,4,2),
              (2,1,4,2),
          ]
          allies=[
              (650,1,3,10,3),
              (651,1,17,8,3),
              (310,1,13,10,1),
              (309,1,12,11,1),
              (654,1,7,13,3),
              (655,1,13,12,0),
              (181,1,1,3,2),
          ]
          enemies=[
              (596,1,20,5,2),
              (594,1,19,5,2),
              (595,1,20,4,2),
              (226,1,19,4,2),
              (597,0,18,0,2),
              (598,0,18,1,2),
              (599,0,21,0,2),
              (600,0,21,1,2),
              (662,0,20,0,2),
              (663,0,19,1,2),
              (664,0,20,1,2),
              (601,0,19,2,2),
              (602,0,20,2,2),
              (225,0,19,0,2),
              (603,0,19,4,0),
          ]

          units=[]
          for cid,x,y,direction in player:
              units.append(dict(characterId=cid,name=name_of(cid),spriteId=sprite_of(cid),
                                faction='player',scripted=False,x=x,y=y,direction=direction))
          for cid,flag,x,y,direction in allies:
              units.append(dict(characterId=cid,name=name_of(cid),spriteId=sprite_of(cid),
                                faction='ally',scripted=(flag!=0),x=x,y=y,direction=direction))
          for cid,flag,x,y,direction in enemies:
              units.append(dict(characterId=cid,name=name_of(cid),spriteId=sprite_of(cid),
                                faction='enemy',scripted=(flag!=0),x=x,y=y,direction=direction))

          battle=dict(
              source='RS/S_00.eex',
              mapId=0,
              map='m000.jpg',
              widthTiles=23,
              heightTiles=16,
              units=units
          )
          (root/'battle'/'battle0.json').write_text(
              json.dumps(battle,ensure_ascii=False,indent=2),encoding='utf-8')

          # S sprites are 8-bit indexed frames in Ls12 records.
          sprite_ids=sorted({u['spriteId'] for u in units})
          for sid in sprite_ids:
              for label,blob,frames in [('unit_mov',mov,11),('unit_spc',spc,5)]:
                  desc=0x110+sid*12
                  unpacked,stored,offset=struct.unpack_from('>III',blob,desc)
                  expected=48*48*frames
                  if unpacked != expected or stored < expected:
                      raise SystemExit(f'Unexpected {label} sid={sid}: {unpacked}/{stored}/{offset}')
                  payload=blob[offset:offset+expected]
                  if len(payload)!=expected:
                      raise SystemExit(f'Truncated {label} sid={sid}')
                  (root/'sprites'/f'{label}_{sid:03d}.bin').write_bytes(payload)

          # Current tactical set uses the base S palette; keep original RGB bytes.
          pu,ps,po=struct.unpack_from('>III',pal,0x110)
          if pu!=768 or ps<768:
              raise SystemExit('Unexpected Spalet record 0')
          (root/'sprites'/'spalet_000.bin').write_bytes(pal[po:po+768])

          print('map bytes=',len(map_bytes))
          print('units=',len(units))
          print('sprite ids=',sprite_ids)
          print('battle json=',(root/'battle'/'battle0.json').read_text(encoding='utf-8'))
          PY

      - name: Build native battle prototype APK
        working-directory: native/android-map-probe
        run: gradle --no-daemon :app:assembleDebug

      - name: Publish private draft APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="native/android-map-probe/app/build/outputs/apk/debug/app-debug.apk"
          OUT="SeongSamgukji-Native-Battle-v0.4.apk"
          cp "$APK" "$OUT"
          if gh release view native-battle-v0.4 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload native-battle-v0.4 "$OUT" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create native-battle-v0.4 "$OUT" --draft \
              --title "PRIVATE - 성삼국지 Native Battle v0.4" \
              --notes "Winlator/Wine 없이 RS/S_00.eex의 첫 전투 배치, Data.e5 인물명, Ekd5.exe S형상 지정표, Unit_spc/Unit_mov/Spalet 원본 데이터를 Android가 직접 사용합니다. 실제 유비·관우·장비 출전 위치와 우군/적군 배치가 표시되며 아군 3명은 터치 이동할 수 있습니다. 반투명 유닛은 시나리오 대기/숨김 슬롯입니다. 공개 배포하지 마세요." \
              --repo "$GITHUB_REPOSITORY"
          fi

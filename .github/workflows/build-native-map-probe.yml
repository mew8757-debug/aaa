name: Build Native Android Battle v2.6

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "native/android-map-probe/**"
      - "native/tools/build_s00_assets.py"
      - ".github/workflows/build-native-map-probe.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download original game data
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/573647280" \
            -o /tmp/game2.zip

          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/573646841" \
            -o /tmp/game1.zip

      - name: Build S00 combat assets
        shell: bash
        run: |
          set -euo pipefail
          python3 native/tools/build_s00_assets.py \
            /tmp/game1.zip \
            /tmp/game2.zip \
            native/android-map-probe/app/src/main/assets

      - name: Build native v2.6 APK
        working-directory: native/android-map-probe
        run: gradle --no-daemon :app:assembleDebug

      - name: Publish private draft APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="native/android-map-probe/app/build/outputs/apk/debug/app-debug.apk"
          OUT="SeongSamgukji-Native-Battle-v2.6.apk"
          cp "${APK}" "${OUT}"

          if gh release view native-battle-v2.6 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload native-battle-v2.6 "${OUT}" --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create native-battle-v2.6 "${OUT}" --draft \
              --title "PRIVATE - 성삼국지 Native Battle v2.6" \
              --notes "Native v2.6은 R02 원본 스토리/출전 종료 뒤 battle2.json을 실제 로드해 S_02 전투에 진입합니다. battle2는 M002 28x24, terrain2, 세 형제 3개 플레이어 슬롯, 원본 0x46 우군/0x47 적군 배치, 원본 이름 역매칭으로 확정한 유비·공손찬·간옹 보호 조건, 20턴/적 전멸 목표, 현재 완전 해석 가능한 Scene2 이벤트를 포함합니다. battle1/battle2 공용 로더로 기존 지형 이동·공격·반격·적 AI를 그대로 재사용합니다. 공개 배포하지 마세요." \
              --repo "${GITHUB_REPOSITORY}"
          fi

      - name: Record v2.6 build status
        if: always()
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native/build-status

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          status = {
              "version": "2.6.0",
              "sourceCommit": os.environ["BUILD_SHA"],
              "status": os.environ["BUILD_STATUS"],
              "turnLoop": True,
              "counterattacks": True,
              "enemyAi": "nearest-opponent-weighted-terrain-v1.0",
          }

          battle_path = Path("native/android-map-probe/app/src/main/assets/battle/battle0.json")
          if battle_path.exists():
              battle = json.loads(battle_path.read_text(encoding="utf-8"))
              status["combatModel"] = battle.get("combatModel")
              status["damageModel"] = battle.get("damageModel")
              status["supportedAttackRangeIds"] = battle.get("supportedAttackRangeIds", [])
              status["terrainIds"] = battle.get("terrainIds", [])
              status["rawCombatSemantics"] = battle.get("rawCombatSemantics", {})
              status["battleEventSummary"] = battle.get("battleEventSummary", {})
              status["aiPolicySupport"] = {
                  "command": "0x4E",
                  "policies": [0, 1, 2, 3, 4, 5, 6],
              }
              status["relativeMoveSupport"] = {
                  "command": "0x6D",
                  "mode": "data-character-relative-to-character",
                  "reviveFlag": True,
              }
              status["nestedEventSupport"] = {
                  "sequence": "0x02",
                  "variableGate": "0x05",
                  "campCountGate": "0x41",
                  "integerVariable": "0x77",
                  "battleStatus": "0x4D",
                  "duelCommands": ["0x5F","0x60","0x61","0x62","0x63","0x64","0x65","0x66","0x68"],
              }
              status["outcomeFlow"] = {
                  "victorySection": 33,
                  "defeatSection": 34,
                  "postBattleScene": "S03-SEC01",
                  "summary": battle.get("outcomeEventSummary", {}),
              }
              status["nextScenarioProbe"] = battle.get(
                  "nextScenarioProbe",
                  {},
              )
              r01_story = battle.get("r01Story", {})
              status["r01Story"] = {
                  "supported": r01_story.get("supported"),
                  "sceneCount": r01_story.get("sceneCount"),
                  "unsupportedActionIds": r01_story.get(
                      "unsupportedActionIds",
                      [],
                  ),
                  "nextBattle": r01_story.get("nextBattle"),
                  "scenes": [
                      {
                          "scene": scene.get("scene"),
                          "section": scene.get("section"),
                          "kind": scene.get("kind"),
                          "actionCount": len(scene.get("actions", [])),
                          "unsupportedActionIds": scene.get(
                              "unsupportedActionIds",
                              [],
                          ),
                      }
                      for scene in r01_story.get("scenes", [])
                  ],
              }
              status["s01InitProbe"] = battle.get("s01InitProbe", {})
              status["relativeMoveProbe"] = [
                  {
                      "characterId": unit.get("characterId"),
                      "name": unit.get("name"),
                      "faction": unit.get("faction"),
                      "visible": unit.get("visible"),
                      "x": unit.get("x"),
                      "y": unit.get("y"),
                      "direction": unit.get("direction"),
                  }
                  for unit in battle.get("units", [])
                  if unit.get("characterId") in (309, 310)
              ]
              objectives = battle.get("battleObjectives", {})
              status["battleObjectives"] = {
                  "phase1": objectives.get("phase1", {}),
                  "phase2": objectives.get("phase2", {}),
                  "protectedCharacterIds": objectives.get("protectedCharacterIds", []),
                  "phase1TransitionEventCount": len(
                      objectives.get("phase1TransitionEvents", [])
                  ),
              }
              diag = battle.get("scenarioDiagnostics", {})
              status["scenarioDiagnostics"] = {
                  "sceneCount": diag.get("sceneCount"),
                  "sectionCounts": diag.get("sectionCounts", []),
                  "commandCount": diag.get("commandCount"),
                  "commandCounts": diag.get("commandCounts", {}),
                  "relevantCommands": diag.get("relevantCommands", []),
                  "selectedSections": diag.get("selectedSections", {}),
              }
              status["playerProfiles"] = [
                  {
                      "characterId": unit.get("characterId"),
                      "name": unit.get("name"),
                      "jobId": unit.get("jobId"),
                      "jobFamily": unit.get("jobFamily"),
                      "movePoints": unit.get("movePoints"),
                      "attackRangeId": unit.get("attackRangeId"),
                      "level": unit.get("level"),
                      "baseLevel": unit.get("baseLevel"),
                      "deployLevel": unit.get("deployLevel"),
                      "hpMax": unit.get("hpMax"),
                      "attack": unit.get("attack"),
                      "defense": unit.get("defense"),
                  }
                  for unit in battle.get("units", [])
                  if unit.get("faction") == "player"
              ]
              status["visibleEnemyProfiles"] = [
                  {
                      "characterId": unit.get("characterId"),
                      "name": unit.get("name"),
                      "attackRangeId": unit.get("attackRangeId"),
                      "level": unit.get("level"),
                      "deployLevel": unit.get("deployLevel"),
                      "hpMax": unit.get("hpMax"),
                      "attack": unit.get("attack"),
                      "defense": unit.get("defense"),
                  }
                  for unit in battle.get("units", [])
                  if unit.get("faction") == "enemy" and unit.get("visible")
              ][:8]


          battle1_path = Path("native/android-map-probe/app/src/main/assets/battle/battle1.json")
          if battle1_path.exists():
              battle1 = json.loads(
                  battle1_path.read_text(encoding="utf-8")
              )
              status["s01Battle"] = {
                  "source": battle1.get("source"),
                  "battleMode": battle1.get("battleMode"),
                  "map": battle1.get("map"),
                  "widthTiles": battle1.get("widthTiles"),
                  "heightTiles": battle1.get("heightTiles"),
                  "terrainIds": battle1.get("terrainIds", []),
                  "unitCount": len(battle1.get("units", [])),
                  "playerCount": sum(
                      1 for u in battle1.get("units", [])
                      if u.get("faction") == "player"
                  ),
                  "allyCount": sum(
                      1 for u in battle1.get("units", [])
                      if u.get("faction") == "ally"
                  ),
                  "enemyCount": sum(
                      1 for u in battle1.get("units", [])
                      if u.get("faction") == "enemy"
                  ),
                  "visibleEnemyCount": sum(
                      1 for u in battle1.get("units", [])
                      if u.get("faction") == "enemy"
                      and u.get("visible")
                  ),
                  "hiddenEnemyCount": sum(
                      1 for u in battle1.get("units", [])
                      if u.get("faction") == "enemy"
                      and not u.get("visible")
                  ),
                  "battleObjectives": battle1.get(
                      "battleObjectives",
                      {},
                  ),
                  "battleEventSummary": battle1.get(
                      "battleEventSummary",
                      {},
                  ),
                  "outcomeProbe": battle1.get("outcomeProbe", {}),
                  "nextScenarioProbe": battle1.get(
                      "nextScenarioProbe",
                      {},
                  ),
                  "outcomeEvents": battle1.get("outcomeEvents", {}),
                  "r02Story": {
                      "supported": battle1.get("r02Story", {}).get("supported"),
                      "sceneCount": battle1.get("r02Story", {}).get("sceneCount"),
                      "unsupportedActionIds": battle1.get(
                          "r02Story",
                          {},
                      ).get("unsupportedActionIds", []),
                      "nextBattle": battle1.get("r02Story", {}).get("nextBattle"),
                      "scenes": [
                          {
                              "scene": scene.get("scene"),
                              "section": scene.get("section"),
                              "kind": scene.get("kind"),
                              "actionCount": len(scene.get("actions", [])),
                              "unsupportedActionIds": scene.get(
                                  "unsupportedActionIds",
                                  [],
                              ),
                          }
                          for scene in battle1.get("r02Story", {}).get(
                              "scenes",
                              [],
                          )
                      ],
                  },
                  "s02InitProbe": battle1.get("s02InitProbe", {}),
              }


          battle2_path = Path("native/android-map-probe/app/src/main/assets/battle/battle2.json")
          if battle2_path.exists():
              battle2 = json.loads(
                  battle2_path.read_text(encoding="utf-8")
              )
              status["s02Battle"] = {
                  "source": battle2.get("source"),
                  "battleMode": battle2.get("battleMode"),
                  "map": battle2.get("map"),
                  "widthTiles": battle2.get("widthTiles"),
                  "heightTiles": battle2.get("heightTiles"),
                  "terrainIds": battle2.get("terrainIds", []),
                  "unitCount": len(battle2.get("units", [])),
                  "playerCount": sum(
                      1 for u in battle2.get("units", [])
                      if u.get("faction") == "player"
                  ),
                  "allyCount": sum(
                      1 for u in battle2.get("units", [])
                      if u.get("faction") == "ally"
                  ),
                  "enemyCount": sum(
                      1 for u in battle2.get("units", [])
                      if u.get("faction") == "enemy"
                  ),
                  "visibleEnemyCount": sum(
                      1 for u in battle2.get("units", [])
                      if u.get("faction") == "enemy"
                      and u.get("visible")
                  ),
                  "hiddenEnemyCount": sum(
                      1 for u in battle2.get("units", [])
                      if u.get("faction") == "enemy"
                      and not u.get("visible")
                  ),
                  "battleObjectives": battle2.get(
                      "battleObjectives",
                      {},
                  ),
                  "battleEventSummary": battle2.get(
                      "battleEventSummary",
                      {},
                  ),
              }

          Path("native/build-status/v2.6.json").write_text(
              json.dumps(status, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/build-status/v2.6.json

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Record native v2.6 build status"
          git push

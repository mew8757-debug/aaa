name: Build Native Android Battle v1.1

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "native/android-map-probe/**"
      - "native/tools/build_s00_assets.py"
      - ".github/workflows/build-native-map-probe.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download original game data
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/573647280" \
            -o /tmp/game2.zip

          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/573646841" \
            -o /tmp/game1.zip

      - name: Build S00 combat assets
        shell: bash
        run: |
          set -euo pipefail
          python3 native/tools/build_s00_assets.py \
            /tmp/game1.zip \
            /tmp/game2.zip \
            native/android-map-probe/app/src/main/assets

      - name: Build native v1.1 APK
        working-directory: native/android-map-probe
        run: gradle --no-daemon :app:assembleDebug

      - name: Publish private draft APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="native/android-map-probe/app/build/outputs/apk/debug/app-debug.apk"
          OUT="SeongSamgukji-Native-Battle-v1.1.apk"
          cp "${APK}" "${OUT}"

          if gh release view native-battle-v1.1 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload native-battle-v1.1 "${OUT}" --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create native-battle-v1.1 "${OUT}" --draft \
              --title "PRIVATE - 성삼국지 Native Battle v1.1" \
              --notes "Native v1.1은 v1.0의 S_00 원본 목표 상태기 위에 Scene 2 전장 이벤트 실행기를 추가합니다. 빌드 시 위치(0x25), 영역(0x26), 인접(0x2E), HP 상태(0x36), 회합(0x3F), 행동 측(0x40), 진영 인원수(0x41) 트리거와 0x05 참/거짓 변수 게이트를 구조화하고, 의미가 확인된 이벤트만 Android에서 재생합니다. 0x0B 변수 설정과 원본 적군/증원 구분도 유지합니다. 중첩 분기나 미확인 액션이 있는 Section은 부분 실행하지 않고 진단에 남겨 잘못된 진행을 막습니다. 지형발휘/병종상성은 정확한 보정 순서가 검증될 때까지 피해 공식에 적용하지 않습니다. 공개 배포하지 마세요." \
              --repo "${GITHUB_REPOSITORY}"
          fi

      - name: Record v1.1 build status
        if: always()
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native/build-status

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          status = {
              "version": "1.1.0",
              "sourceCommit": os.environ["BUILD_SHA"],
              "status": os.environ["BUILD_STATUS"],
              "turnLoop": True,
              "counterattacks": True,
              "enemyAi": "nearest-opponent-weighted-terrain-v1.0",
          }

          battle_path = Path("native/android-map-probe/app/src/main/assets/battle/battle0.json")
          if battle_path.exists():
              battle = json.loads(battle_path.read_text(encoding="utf-8"))
              status["combatModel"] = battle.get("combatModel")
              status["damageModel"] = battle.get("damageModel")
              status["supportedAttackRangeIds"] = battle.get("supportedAttackRangeIds", [])
              status["terrainIds"] = battle.get("terrainIds", [])
              status["rawCombatSemantics"] = battle.get("rawCombatSemantics", {})
              status["battleEventSummary"] = battle.get("battleEventSummary", {})
              objectives = battle.get("battleObjectives", {})
              status["battleObjectives"] = {
                  "phase1": objectives.get("phase1", {}),
                  "phase2": objectives.get("phase2", {}),
                  "protectedCharacterIds": objectives.get("protectedCharacterIds", []),
                  "phase1TransitionEventCount": len(
                      objectives.get("phase1TransitionEvents", [])
                  ),
              }
              diag = battle.get("scenarioDiagnostics", {})
              status["scenarioDiagnostics"] = {
                  "sceneCount": diag.get("sceneCount"),
                  "sectionCounts": diag.get("sectionCounts", []),
                  "commandCount": diag.get("commandCount"),
                  "commandCounts": diag.get("commandCounts", {}),
                  "relevantCommands": diag.get("relevantCommands", []),
                  "selectedSections": diag.get("selectedSections", {}),
              }
              status["playerProfiles"] = [
                  {
                      "characterId": unit.get("characterId"),
                      "name": unit.get("name"),
                      "jobId": unit.get("jobId"),
                      "jobFamily": unit.get("jobFamily"),
                      "movePoints": unit.get("movePoints"),
                      "attackRangeId": unit.get("attackRangeId"),
                      "level": unit.get("level"),
                      "baseLevel": unit.get("baseLevel"),
                      "deployLevel": unit.get("deployLevel"),
                      "hpMax": unit.get("hpMax"),
                      "attack": unit.get("attack"),
                      "defense": unit.get("defense"),
                  }
                  for unit in battle.get("units", [])
                  if unit.get("faction") == "player"
              ]
              status["visibleEnemyProfiles"] = [
                  {
                      "characterId": unit.get("characterId"),
                      "name": unit.get("name"),
                      "attackRangeId": unit.get("attackRangeId"),
                      "level": unit.get("level"),
                      "deployLevel": unit.get("deployLevel"),
                      "hpMax": unit.get("hpMax"),
                      "attack": unit.get("attack"),
                      "defense": unit.get("defense"),
                  }
                  for unit in battle.get("units", [])
                  if unit.get("faction") == "enemy" and unit.get("visible")
              ][:8]

          Path("native/build-status/v1.1.json").write_text(
              json.dumps(status, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/build-status/v1.1.json

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Record native v1.1 build status"
          git push

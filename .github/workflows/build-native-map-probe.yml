name: Build Native Android Map Probe

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "native/android-map-probe/**"
      - ".github/workflows/build-native-map-probe.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download private game2 archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native/android-map-probe/app/src/main/assets/map
          curl --fail --location --silent --show-error             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/octet-stream"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/573647280"             -o /tmp/game2.zip
          python3 - <<'PY'
          import zipfile, pathlib
          with zipfile.ZipFile('/tmp/game2.zip') as z:
              data=z.read('map/m000.jpg')
          p=pathlib.Path('native/android-map-probe/app/src/main/assets/map/m000.jpg')
          p.write_bytes(data)
          print('m000.jpg bytes=',len(data))
          PY

      - name: Build native map probe APK
        working-directory: native/android-map-probe
        run: gradle --no-daemon :app:assembleDebug

      - name: Publish private draft APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="native/android-map-probe/app/build/outputs/apk/debug/app-debug.apk"
          OUT="SeongSamgukji-Native-MapProbe-v0.1.apk"
          cp "$APK" "$OUT"
          if gh release view native-map-probe-v0.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload native-map-probe-v0.1 "$OUT" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create native-map-probe-v0.1 "$OUT" --draft               --title "PRIVATE - 성삼국지 Native Map Probe v0.1"               --notes "Winlator/Wine 없이 Android Canvas에서 실제 m000.jpg 전투맵을 직접 렌더링하는 첫 네이티브 프로토타입입니다. 핀치 줌, 드래그 이동, 48px 타일 좌표 선택을 지원합니다. 공개 배포하지 마세요."               --repo "$GITHUB_REPOSITORY"
          fi

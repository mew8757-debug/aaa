                  "postBattleScene": "S03-SEC01",
                  "summary": battle.get("outcomeEventSummary", {}),
              }
              status["nextScenarioProbe"] = battle.get(
                  "nextScenarioProbe",
                  {},
              )
              r01_story = battle.get("r01Story", {})
              status["r01Story"] = {
                  "supported": r01_story.get("supported"),

name: Build Native Android Battle v4.11

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "native/android-map-probe/**"
      - "native/tools/build_s00_assets.py"
      - ".github/workflows/build-native-map-probe.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download original game data
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/573647280" \
            -o /tmp/game2.zip

          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/573646841" \
            -o /tmp/game1.zip

      - name: Build S00 combat assets
        shell: bash
        run: |
          set -euo pipefail
          python3 native/tools/build_s00_assets.py \
            /tmp/game1.zip \
            /tmp/game2.zip \
            native/android-map-probe/app/src/main/assets

      - name: Build native v4.11 APK
        working-directory: native/android-map-probe
        run: gradle --no-daemon :app:assembleDebug

      - name: Publish private draft APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="native/android-map-probe/app/build/outputs/apk/debug/app-debug.apk"
          OUT="SeongSamgukji-Native-Battle-v4.11.apk"
          cp "${APK}" "${OUT}"

          if gh release view native-battle-v4.11 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload native-battle-v4.11 "${OUT}" --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create native-battle-v4.11 "${OUT}" --draft \
              --title "PRIVATE - 성삼국지 Native Battle v4.11" \
              --notes "Native v4.11은 S08 승리 후 R09 Scene 1~17 + Scene18 출전 흐름을 실제 재생하고 battle9.json으로 S09에 진입합니다. R09 출전 0x06에서 8인 roster를 자동 추출하며, S09는 S00 전용 제외목록을 제거해 종료 Section 56/57/74/75 외 Scene2 전장 이벤트를 전부 재컴파일합니다. 조조 격퇴 Section51의 변수56을 승리 신호로 연결하고 유비(0)·도겸(145) 사망 및 20턴 초과를 원본 패배 흐름으로 처리합니다. 최신 main의 S08 판정이 S07 블록에 잘못 중첩된 회귀도 수정합니다. 공개 배포하지 마세요." \
              --repo "${GITHUB_REPOSITORY}"
          fi

      - name: Record v4.11 build status
        if: always()
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native/build-status

          python3 - <<'PY'

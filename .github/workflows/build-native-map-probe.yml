name: Build Native Android Battle

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "native/android-map-probe/**"
      - ".github/workflows/build-native-map-probe.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate native battle and opening-event assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native/android-map-probe/app/src/main/assets/map
          mkdir -p native/android-map-probe/app/src/main/assets/sprites
          mkdir -p native/android-map-probe/app/src/main/assets/battle

          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/573647280" \
            -o /tmp/game2.zip

          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/573646841" \
            -o /tmp/game1.zip

          python3 - <<'PY'
          import json
          import pathlib
          import re
          import struct
          import urllib.request
          import zipfile

          assets = pathlib.Path('native/android-map-probe/app/src/main/assets')
          sprites = assets / 'sprites'
          battle_dir = assets / 'battle'

          with zipfile.ZipFile('/tmp/game2.zip') as z2:
              map_data = z2.read('map/m000.jpg')
          (assets / 'map' / 'm000.jpg').write_bytes(map_data)
          print('m000.jpg bytes=', len(map_data))

          with zipfile.ZipFile('/tmp/game1.zip') as z1:
              data = z1.read('Data.e5')
              exe = z1.read('Ekd5.exe')
              mov = z1.read('Unit_mov.e5')
              spc = z1.read('Unit_spc.e5')
              pal = z1.read('Spalet.e5')
              s00 = z1.read('RS/S_00.eex')

          def be_desc(blob, zero_based_index):
              off = 0x110 + zero_based_index * 12
              if off < 0 or off + 12 > len(blob):
                  return None
              size, stored, data_off = struct.unpack_from('>III', blob, off)
              if size <= 0 or stored <= 0 or data_off < 0:
                  return None
              if data_off + min(size, stored) > len(blob):
                  return None
              return size, stored, data_off

          pdesc = be_desc(pal, 0)
          if not pdesc:
              raise SystemExit('Spalet.e5 record 0 invalid')
          psize, pstored, poff = pdesc
          palette = pal[poff:poff + 768]
          if len(palette) != 768:
              raise SystemExit('Spalet palette truncated')
          (sprites / 'palette.bin').write_bytes(palette)
          print('palette=', psize, pstored, poff, 'bytes=', len(palette))

          def s16(buf, off):
              return int.from_bytes(buf[off:off+2], 'little', signed=True)

          def u16(buf, off):
              return int.from_bytes(buf[off:off+2], 'little', signed=False)

          def i32(buf, off):
              return int.from_bytes(buf[off:off+4], 'little', signed=True)

          def decode_numeric_command(sec, off, types, records=1):
              if off + 2 > len(sec):
                  raise ValueError('command header out of range')
              p = off + 2
              out = []
              for _ in range(records):
                  row = []
                  for typ in types:
                      if p + 2 > len(sec):
                          raise ValueError('parameter tag out of range')
                      p += 2
                      if typ == 0x04:
                          if p + 4 > len(sec):
                              raise ValueError('int32 out of range')
                          row.append(i32(sec, p))
                          p += 4
                      else:
                          if p + 2 > len(sec):
                              raise ValueError('int16 out of range')
                          row.append(s16(sec, p))
                          p += 2
                  out.append(row)
              return out, p - off

          scene0 = int.from_bytes(s00[10:14], 'little')
          section_count = u16(s00, scene0)
          if section_count < 1:
              raise SystemExit('S_00 scene0 has no sections')
          section_len = u16(s00, scene0 + 2)
          sec = s00[scene0+4:scene0+4+section_len]

          ally_off = 63
          enemy_off = 1105
          player_offs = [5607, 5635, 5663]
          if sec[ally_off] != 0x46:
              raise SystemExit(f'Expected 0x46 at {ally_off}, got {sec[ally_off]:02x}')
          if sec[enemy_off] != 0x47:
              raise SystemExit(f'Expected 0x47 at {enemy_off}, got {sec[enemy_off]:02x}')
          if any(sec[o] != 0x4B for o in player_offs):
              raise SystemExit('Expected three 0x4B player slots')

          ally_types = [0x02,0x26,0x04,0x04,0x2B,0x3E,0x45,0x07,0x02,0x04,0x04]
          enemy_types = [0x02,0x26,0x26,0x04,0x04,0x2B,0x3E,0x45,0x07,0x02,0x04,0x04]
          player_types = [0x04,0x04,0x04,0x2B,0x26]

          ally_rows, ally_used = decode_numeric_command(sec, ally_off, ally_types, 20)
          enemy_rows, enemy_used = decode_numeric_command(sec, enemy_off, enemy_types, 80)

          player_slots = []
          for off in player_offs:
              rows, used = decode_numeric_command(sec, off, player_types, 1)
              if used != 28:
                  raise SystemExit(f'Unexpected 0x4B length {used}')
              player_slots.append(rows[0])
          player_slots.sort(key=lambda r: r[0])

          print('ally 0x46 bytes=', ally_used)
          print('enemy 0x47 bytes=', enemy_used)
          print('player slots=', player_slots)

          def char_info(cid):
              row = 0x18C + cid * 0x20
              if row + 0x20 > len(data):
                  raise ValueError(f'character out of Data.e5 range: {cid}')
              raw_name = data[row:row+13].split(b'\0', 1)[0]
              name = raw_name.decode('cp949', 'replace').replace('\x00', '').strip()
              job = data[row + 26]
              level = data[row + 27]
              s_id = int.from_bytes(exe[0xD2800 + cid*2:0xD2802 + cid*2], 'little')
              return name or f'인물{cid}', job, level, s_id

          def map_s_to_unit_image(s_id, job, faction_slot, promotion_tier):
              if s_id == 0:
                  return job * 3 + faction_slot
              if 1 <= s_id <= 32:
                  tier = max(0, min(2, promotion_tier))
                  return 241 + (s_id - 1) * 3 + tier
              return 337 + (s_id - 33)

          MOV_BYTES = 48 * 48 * 11
          SPC_BYTES = 48 * 48 * 5

          def valid_raw(blob, image_number, expected):
              if image_number < 1:
                  return False
              desc = be_desc(blob, image_number - 1)
              if not desc:
                  return False
              size, stored, off = desc
              return size >= expected and stored >= expected and off + expected <= len(blob)

          def safe_unit_image(image_number, job, faction_slot):
              if valid_raw(mov, image_number, MOV_BYTES) and valid_raw(spc, image_number, SPC_BYTES):
                  return image_number
              fallback = job * 3 + faction_slot
              if valid_raw(mov, fallback, MOV_BYTES) and valid_raw(spc, fallback, SPC_BYTES):
                  print('sprite fallback', image_number, '->', fallback)
                  return fallback
              print('sprite fallback', image_number, '-> 1')
              return 1

          units = []

          def add_unit(cid, faction, x, y, direction, level, class_tier, visible, source):
              name, job, data_level, s_id = char_info(cid)
              faction_slot = {0:1, 1:2, 2:3}[faction]
              image = map_s_to_unit_image(s_id, job, faction_slot, class_tier)
              image = safe_unit_image(image, job, faction_slot)
              units.append({
                  'characterId': cid,
                  'name': name,
                  'faction': faction,
                  'x': x,
                  'y': y,
                  'direction': direction,
                  'level': level if level >= 0 else data_level,
                  'job': job,
                  'sImage': s_id,
                  'unitImage': image,
                  'visible': bool(visible),
                  'source': source
              })

          for cid, slot in zip([0, 1, 2], player_slots):
              _, x, y, direction, _flag = slot
              name, job, data_level, s_id = char_info(cid)
              add_unit(cid, 0, x, y, direction, data_level, 0, True, 'S_00:0x4B')

          # 0x46: person, hidden, x, y, direction, level, class-tier, AI,
          #       target-person, target-x, target-y.
          for record_index, row in enumerate(ally_rows):
              person = row[0]
              if person < 0:
                  continue
              hidden = row[1]
              add_unit(
                  person, 1, row[2], row[3], row[4], row[5], row[6],
                  hidden == 0, f'S_00:0x46:{record_index}')

          # 0x47: person, reinforcement, hidden, x, y, direction, level,
          #       class-tier, AI, target-person, target-x, target-y.
          for record_index, row in enumerate(enemy_rows):
              person = row[0]
              if person < 0:
                  continue
              hidden = row[2]
              add_unit(
                  person, 2, row[3], row[4], row[5], row[6], row[7],
                  hidden == 0, f'S_00:0x47:{record_index}')

          # Read the legacy command schema as format metadata, then independently
          # translate only the visual commands needed for the S_00 opening.
          src = urllib.request.urlopen(
              'https://raw.githubusercontent.com/Puluomiyuhun/ccz-SceneEditor/main/cczEditor2/cczEditor2View.h',
              timeout=30).read().decode('utf-8', 'replace')

          m = re.search(r'int code_instruct\[124\]\[13\] = \{(.*?)\n\s*\};', src, re.S)
          if not m:
              raise SystemExit('code_instruct metadata not found')
          vals = [int(x, 0) for x in re.findall(r'-1|0x[0-9A-Fa-f]+|\d+', m.group(1))]
          table = [vals[i*13:(i+1)*13] for i in range(124)]

          mt = re.search(r'byte code_test\[124\] = \{([^}]*)\}', src, re.S)
          if not mt:
              raise SystemExit('code_test metadata not found')
          test = [int(x, 0) for x in re.findall(r'0x[0-9A-Fa-f]+|\d+', mt.group(1))]
          test += [0] * (124 - len(test))

          def parse_cmd(sec, k):
              cid = sec[k]
              p = k + 2
              params = []
              count = 13
              if cid == 0x46:
                  count = 11 * 20
              elif cid == 0x47:
                  count = 12 * 80

              for i in range(count):
                  typ = table[cid][i % 13]
                  if cid == 0x46:
                      typ = table[cid][i % 11]
                  elif cid == 0x47:
                      typ = table[cid][i % 12]
                  if typ == -1:
                      break

                  if p + 2 > len(sec):
                      raise ValueError((cid, k, 'tag overflow'))
                  p += 2

                  if typ == 0x05:
                      e = sec.find(b'\0', p)
                      if e < 0:
                          raise ValueError((cid, k, 'string overflow'))
                      raw = sec[p:e]
                      p = e + 1
                      params.append(raw.decode('cp949', 'replace'))
                  elif typ == 0x35:
                      n = u16(sec, p)
                      p += 2
                      arr = [s16(sec, p + 2*j) for j in range(n)]
                      p += 2*n
                      params.append(arr)
                  elif typ == 0x04:
                      params.append(i32(sec, p))
                      p += 4
                  else:
                      params.append(s16(sec, p))
                      p += 2

              return cid, p-k, params

          def split_dialogue(raw_text):
              clean = raw_text.replace('\r', '')
              lines = clean.split('\n')
              speaker = ''
              if lines and lines[0].startswith('&'):
                  speaker = lines[0][1:].strip()
                  body = '\n'.join(lines[1:]).strip()
              else:
                  body = clean.strip()
              return speaker, body

          events = []
          k = 0
          head = True
          zflag = False
          zsum = 0
          while k < len(sec):
              cmd_off = k
              cid, used, params = parse_cmd(sec, k)

              if cmd_off >= 5760:
                  if cid == 0x09 and params:
                      events.append({'type':'delay', 'value':max(1, int(params[0]))})
                  elif cid in (0x14, 0x15, 0x16, 0x69, 0x7A):
                      strings = [p for p in params if isinstance(p, str)]
                      if strings:
                          speaker, body = split_dialogue(strings[-1])
                          if body or speaker:
                              events.append({
                                  'type':'dialogue',
                                  'speaker':speaker,
                                  'text':body or speaker
                              })
                  elif cid == 0x23 and params:
                      events.append({'type':'sound', 'value':int(params[0])})
                  elif cid == 0x24 and params:
                      events.append({'type':'music', 'value':int(params[0])})
                  elif cid == 0x30 and len(params) >= 5:
                      char_id = int(params[0])
                      events.append({'type':'reveal', 'characterId':char_id})
                      events.append({
                          'type':'move', 'characterId':char_id,
                          'x':int(params[1]), 'y':int(params[2]),
                          'direction':int(params[3])
                      })
                      if int(params[4]) >= 0:
                          events.append({
                              'type':'action', 'characterId':char_id,
                              'value':int(params[4])
                          })
                  elif cid == 0x31 and len(params) >= 2 and int(params[0]) == 0:
                      events.append({'type':'hide', 'characterId':int(params[1])})
                  elif cid == 0x32 and len(params) >= 6 and int(params[0]) != 1:
                      events.append({
                          'type':'move',
                          'characterId':int(params[1]),
                          'x':int(params[3]),
                          'y':int(params[4]),
                          'direction':int(params[5])
                      })
                  elif cid == 0x33 and len(params) >= 3:
                      char_id = int(params[0])
                      if int(params[1]) >= 0:
                          events.append({'type':'action', 'characterId':char_id, 'value':int(params[1])})
                      events.append({'type':'turn', 'characterId':char_id, 'direction':int(params[2])})
                  elif cid == 0x34 and len(params) >= 2:
                      events.append({'type':'action', 'characterId':int(params[0]), 'value':int(params[1])})
                  elif cid == 0x4C and len(params) >= 3:
                      char_id = int(params[1]) if int(params[0]) == 0 else -1
                      if char_id >= 0:
                          events.append({'type':'reveal', 'characterId':char_id})
                  elif cid == 0x4F and len(params) >= 6:
                      events.append({
                          'type':'turn',
                          'characterId':int(params[0]),
                          'targetId':int(params[1]),
                          'direction':int(params[2])
                      })
                  elif cid == 0x50 and len(params) >= 2:
                      events.append({
                          'type':'action',
                          'characterId':int(params[0]),
                          'value':int(params[1])
                      })
                  elif cid == 0x53 and len(params) >= 2 and int(params[0]) != 1:
                      events.append({'type':'retreat', 'characterId':int(params[1])})
                  elif cid == 0x5A:
                      events.append({'type':'end'})
                      break

              k += used

              if cid == 0 and head:
                  head = False
                  k += 2

              if cid == 1:
                  zflag = True
              elif zflag:
                  if cid < len(test) and test[cid] != 0:
                      zsum += 1
                      k += 2
                  zflag = False

              if cid == 0 and zsum > 0:
                  zsum -= 1

          referenced_ids = sorted({
              e.get('characterId') for e in events
              if isinstance(e.get('characterId'), int) and e.get('characterId') >= 0
          })
          unit_ids = {u['characterId'] for u in units}
          missing_event_units = [cid for cid in referenced_ids if cid not in unit_ids]
          print('opening events=', len(events),
                'dialogues=', sum(1 for e in events if e['type']=='dialogue'),
                'moves=', sum(1 for e in events if e['type']=='move'))
          print('event character ids=', referenced_ids)
          print('missing event units=', missing_event_units)

          # Most opening actors are pre-deployed hidden via 0x46/0x47. If an
          # event references an unlisted actor, include it invisibly at 0,0 so
          # the event runner can still reveal it instead of crashing.
          for cid in missing_event_units:
              try:
                  add_unit(cid, 1, 0, 0, 2, -1, 0, False, 'S_00:event-reference')
              except Exception as ex:
                  print('cannot add event-only actor', cid, ex)

          images = sorted({u['unitImage'] for u in units})
          for image_number in images:
              mdesc = be_desc(mov, image_number - 1)
              sdesc = be_desc(spc, image_number - 1)
              if not mdesc or not sdesc:
                  raise SystemExit(f'No E5 record for Unit image {image_number}')
              _, _, moff = mdesc
              _, _, soff = sdesc
              mpayload = mov[moff:moff + MOV_BYTES]
              spayload = spc[soff:soff + SPC_BYTES]
              if len(mpayload) != MOV_BYTES or len(spayload) != SPC_BYTES:
                  raise SystemExit(f'Truncated Unit image {image_number}')
              (sprites / f'mov_{image_number:04d}.bin').write_bytes(mpayload)
              (sprites / f'spc_{image_number:04d}.bin').write_bytes(spayload)
              print('sprite image=', image_number, 'mov=', len(mpayload), 'spc=', len(spayload))

          battle = {
              'version': 5,
              'map': 'm000',
              'source': 'RS/S_00.eex Scene0 initialization + opening event stream',
              'units': units,
              'openingEvents': events,
          }
          (battle_dir / 'battle0.json').write_text(
              json.dumps(battle, ensure_ascii=False, indent=2),
              encoding='utf-8')

          visible_count = sum(1 for u in units if u['visible'])
          print('battle units=', len(units), 'visible=', visible_count, 'images=', images)
          print('first events:')
          for e in events[:30]:
              print(e)
          PY

      - name: Build native battle APK
        working-directory: native/android-map-probe
        run: gradle --no-daemon :app:assembleDebug

      - name: Publish private draft APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="native/android-map-probe/app/build/outputs/apk/debug/app-debug.apk"
          OUT="SeongSamgukji-Native-Battle-v0.5.apk"
          cp "$APK" "$OUT"
          if gh release view native-battle-v0.5 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload native-battle-v0.5 "$OUT" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create native-battle-v0.5 "$OUT" --draft \
              --title "PRIVATE - 성삼국지 Native Battle v0.5" \
              --notes "Winlator/Wine 없이 원본 RS/S_00.eex의 첫 전투 오프닝 이벤트를 Android에서 직접 재생하는 네이티브 프로토타입입니다. 0x46/0x47 숨김 배치, 유비/관우/장비 출전 위치, CP949 원본 대사, 0x32 이동, 0x4C 등장, 0x4F 전환, 0x50 동작, 0x53 퇴각, 지연과 BGM/효과음 지시를 원본 순서에서 추출합니다. 현재 실제 음원 재생과 전투 규칙/AI는 다음 단계입니다. 공개 배포하지 마세요." \
              --repo "$GITHUB_REPOSITORY"
          fi

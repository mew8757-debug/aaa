name: Build OneTouch SeongSamgukji APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "standalone/**"
      - ".github/workflows/build-standalone.yml"

concurrency:
  group: seong-onetouch-v14
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout customization repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK, NDK and CMake
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;24.0.8215888" "cmake;3.22.1"

      - name: Fetch pinned Winlator 11.2 source
        shell: bash
        run: |
          git init winlator-src
          cd winlator-src
          git remote add origin https://github.com/brunodev85/winlator-app.git
          git fetch --depth 1 origin a030f552f452158a2db64fdb32b490fa19c0b48d
          git checkout FETCH_HEAD

      - name: Download private game data from draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p game-data

          GAME1_ID="573646841"
          GAME2_ID="573647280"

          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${GAME1_ID}" \
            -o game-data/game1.zip

          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${GAME2_ID}" \
            -o game-data/game2.zip

          test "$(stat -c%s game-data/game1.zip)" -gt 200000000
          test "$(stat -c%s game-data/game2.zip)" -gt 450000000
          ls -lh game-data/

      - name: Apply one-touch game front-end
        shell: bash
        run: |
          cp standalone/SeongSamgukjiActivity.java \
            winlator-src/app/src/main/java/com/winlator/SeongSamgukjiActivity.java

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest_path = Path("winlator-src/app/src/main/AndroidManifest.xml")
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          ns = "{http://schemas.android.com/apk/res/android}"
          tree = ET.parse(manifest_path)
          root = tree.getroot()
          app = root.find("application")
          app.set(ns+"label", "성삼국지 촉한영걸전")
          app.set(ns+"largeHeap", "true")

          for act in app.findall("activity"):
              if act.get(ns+"name") == "com.winlator.MainActivity":
                  for flt in list(act.findall("intent-filter")):
                      act.remove(flt)
                  act.set(ns+"exported", "false")

          new_act = ET.Element("activity")
          new_act.set(ns+"name", "com.winlator.SeongSamgukjiActivity")
          new_act.set(ns+"theme", "@style/AppThemeDark")
          new_act.set(ns+"exported", "true")
          new_act.set(ns+"screenOrientation", "sensorLandscape")
          new_act.set(ns+"configChanges", "keyboard|keyboardHidden|orientation|screenSize|screenLayout|smallestScreenSize|density|navigation")
          flt = ET.SubElement(new_act, "intent-filter")
          action = ET.SubElement(flt, "action")
          action.set(ns+"name", "android.intent.action.MAIN")
          cat = ET.SubElement(flt, "category")
          cat.set(ns+"name", "android.intent.category.LAUNCHER")
          app.insert(0, new_act)

          tree.write(manifest_path, encoding="utf-8", xml_declaration=True)

          gradle = Path("winlator-src/app/build.gradle")
          s = gradle.read_text()
          # IMPORTANT: keep applicationId 'com.winlator'. Native Winlator code contains
          # hard-coded /data/data/com.winlator paths for cache/X11/Vortek sockets.
          s = s.replace("versionCode 33", "versionCode 1")
          s = s.replace('versionName "11.2"', 'versionName "2.3.0"')
          gradle.write_text(s)

          # v14: keep the persistent Explorer path from v13, but launch a batch file
          # that explicitly switches the Windows current directory to D:\ before Ekd5.exe.
          # The game loads map resources via relative paths (Mmap.e5/Pmap.e5/etc.).
          xserver = Path("winlator-src/app/src/main/java/com/winlator/XServerDisplayActivity.java")
          xs = xserver.read_text()

          callback_old = 'guestProgramLauncherComponent.setTerminationCallback((status) -> exit());'
          callback_new = '''guestProgramLauncherComponent.setTerminationCallback((status) -> {
                if (!getIntent().hasExtra("exec_path") && !getIntent().hasExtra("seong_exec_path")) exit();
            });'''
          if callback_old not in xs:
              raise SystemExit("Expected termination callback not found")
          xs = xs.replace(callback_old, callback_new, 1)

          nl = chr(10)
          start_old = '    private String getWineStartCommand() {' + nl + '        String cmdArgs = "";'
          start_new = ('    private String getWineStartCommand() {' + nl +
                       '        String seongExecPath = getIntent().getStringExtra("seong_exec_path");' + nl +
                       '        if (seongExecPath != null && !seongExecPath.isEmpty()) {' + nl +
                       '            return "C:\\\\windows\\\\system32\\\\cmd.exe /c D:\\\\SeongLaunch.bat";' + nl +
                       '        }' + nl + nl +
                       '        String cmdArgs = "";')
          if start_old not in xs:
              raise SystemExit("Expected getWineStartCommand header not found")
          xs = xs.replace(start_old, start_new, 1)

          xserver.write_text(xs)
          PY

      - name: Build base APK
        working-directory: winlator-src
        env:
          GRADLE_OPTS: -Xmx3g -Dfile.encoding=UTF-8
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Inject game data, align and re-sign APK
        shell: bash
        run: |
          set -euo pipefail

          BASE="winlator-src/app/build/outputs/apk/debug/app-debug.apk"
          WORK="$PWD/SeongSamgukji-OneTouch-working.apk"
          ALIGNED="$PWD/SeongSamgukji-OneTouch-aligned.apk"
          FINAL="$PWD/SeongSamgukji-OneTouch-v14.apk"

          test -f "$BASE"
          cp "$BASE" "$WORK"

          # Remove old v1 signature files before changing the ZIP contents.
          zip -q -d "$WORK" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/MANIFEST.MF' || true

          rm -rf apk-inject
          mkdir -p apk-inject/assets/seong
          cp game-data/game1.zip apk-inject/assets/seong/game1.zip
          cp game-data/game2.zip apk-inject/assets/seong/game2.zip

          # The game archives are already compressed. Store them without recompression.
          (
            cd apk-inject
            zip -0 -q "$WORK" assets/seong/game1.zip assets/seong/game2.zip
          )

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS="$SDK_ROOT/build-tools/35.0.0"

          "$BUILD_TOOLS/zipalign" -f -p 4 "$WORK" "$ALIGNED"

          KS="$HOME/.android/debug.keystore"
          if [ ! -f "$KS" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v \
              -keystore "$KS" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KS" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$FINAL" \
            "$ALIGNED"

          "$BUILD_TOOLS/apksigner" verify --verbose "$FINAL"

          test "$(stat -c%s "$FINAL")" -gt 800000000
          ls -lh "$FINAL"
          sha256sum "$FINAL"

      - name: Upload final APK to private draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          FINAL="SeongSamgukji-OneTouch-v14.apk"

          if gh release view one-touch-v14 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload one-touch-v14 "$FINAL" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create one-touch-v14 "$FINAL" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "PRIVATE - 성삼국지 촉한영걸전 원터치 APK v14" \
              --notes "비공개 개인용 수정판입니다. v13에서 처음으로 맵 파일 관련 오류 팝업까지 진입한 것을 바탕으로, 게임 실행 전 Windows 현재 폴더를 D:\\로 명시적으로 설정하는 SeongLaunch.bat를 사용합니다. 설치 단계에서 Mmap.e5, Pmap.e5, Pmapobj.e5, Hexzmap.e5 존재 여부도 검증합니다. 공개 배포하지 마세요."
          fi

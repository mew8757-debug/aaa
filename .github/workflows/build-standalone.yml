name: Build OneTouch SeongSamgukji APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "standalone/**"
      - ".github/workflows/build-standalone.yml"

concurrency:
  group: seong-onetouch
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout customization repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK, NDK and CMake
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;24.0.8215888" "cmake;3.22.1"

      - name: Fetch pinned Winlator 11.2 source
        shell: bash
        run: |
          git init winlator-src
          cd winlator-src
          git remote add origin https://github.com/brunodev85/winlator-app.git
          git fetch --depth 1 origin a030f552f452158a2db64fdb32b490fa19c0b48d
          git checkout FETCH_HEAD

      - name: Download private game data from draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p winlator-src/app/src/main/assets/seong

          # Private draft release IDs verified before this build.
          GAME1_ID="573646841"
          GAME2_ID="573647280"

          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${GAME1_ID}" \
            -o winlator-src/app/src/main/assets/seong/game1.zip

          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${GAME2_ID}" \
            -o winlator-src/app/src/main/assets/seong/game2.zip

          test "$(stat -c%s winlator-src/app/src/main/assets/seong/game1.zip)" -gt 200000000
          test "$(stat -c%s winlator-src/app/src/main/assets/seong/game2.zip)" -gt 450000000

          echo "Bundled game data:"
          ls -lh winlator-src/app/src/main/assets/seong/

      - name: Apply one-touch game front-end
        shell: bash
        run: |
          cp standalone/SeongSamgukjiActivity.java \
            winlator-src/app/src/main/java/com/winlator/SeongSamgukjiActivity.java

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest_path = Path("winlator-src/app/src/main/AndroidManifest.xml")
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          ns = "{http://schemas.android.com/apk/res/android}"
          tree = ET.parse(manifest_path)
          root = tree.getroot()
          app = root.find("application")
          app.set(ns+"label", "성삼국지 촉한영걸전")

          for act in app.findall("activity"):
              if act.get(ns+"name") == "com.winlator.MainActivity":
                  for f in list(act.findall("intent-filter")):
                      act.remove(f)
                  act.set(ns+"exported", "false")

          new_act = ET.Element("activity")
          new_act.set(ns+"name", "com.winlator.SeongSamgukjiActivity")
          new_act.set(ns+"theme", "@style/AppThemeDark")
          new_act.set(ns+"exported", "true")
          new_act.set(ns+"screenOrientation", "sensorLandscape")
          new_act.set(ns+"configChanges", "keyboard|keyboardHidden|orientation|screenSize|screenLayout|smallestScreenSize|density|navigation")
          filt = ET.SubElement(new_act, "intent-filter")
          action = ET.SubElement(filt, "action")
          action.set(ns+"name", "android.intent.action.MAIN")
          cat = ET.SubElement(filt, "category")
          cat.set(ns+"name", "android.intent.category.LAUNCHER")
          app.insert(0, new_act)

          for prov in app.findall("provider"):
              if prov.get(ns+"name") == "androidx.core.content.FileProvider":
                  prov.set(ns+"authorities", "kr.co.seongsamgukji.oneclick.FileProvider")

          tree.write(manifest_path, encoding="utf-8", xml_declaration=True)

          gradle = Path("winlator-src/app/build.gradle")
          s = gradle.read_text()
          s = s.replace("applicationId 'com.winlator'", "applicationId 'kr.co.seongsamgukji.oneclick'")
          s = s.replace('versionCode 33', 'versionCode 1')
          s = s.replace('versionName "11.2"', 'versionName "1.0.0"')
          s = s.replace(
              "android {\n    namespace 'com.winlator'",
              "android {\n    namespace 'com.winlator'\n\n    aaptOptions {\n        noCompress 'zip'\n    }"
          )
          gradle.write_text(s)

          fileutils = Path("winlator-src/app/src/main/java/com/winlator/core/FileUtils.java")
          s = fileutils.read_text()
          s = s.replace('"com.winlator.FileProvider"', '"kr.co.seongsamgukji.oneclick.FileProvider"')
          fileutils.write_text(s)
          PY

      - name: Apply phone-friendly controls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("winlator-src/app/src/main/java/com/winlator/XServerDisplayActivity.java")
          s = p.read_text()

          old = "    @Override\n    public void onBackPressed() {\n        if (environment != null) {\n            if (!drawerLayout.isDrawerOpen(GravityCompat.START)) {\n                drawerLayout.openDrawer(GravityCompat.START);\n            }\n            else drawerLayout.closeDrawers();\n        }\n    }"
          new = "    @Override\n    public void onBackPressed() {\n        if (xServer != null) {\n            xServer.keyboard.onKeyEvent(new KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_ESCAPE));\n            xServer.keyboard.onKeyEvent(new KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_ESCAPE));\n        }\n    }"
          if old in s:
              s = s.replace(old, new)

          s = s.replace(
              'renderer.setForceWindowsFullscreen(shortcut != null && shortcut.getExtra("forceFullscreen", "0").equals("1"));',
              'renderer.setForceWindowsFullscreen(true);'
          )
          p.write_text(s)
          PY

      - name: Build one-touch APK
        working-directory: winlator-src
        env:
          GRADLE_OPTS: -Xmx4g -Dfile.encoding=UTF-8
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Verify bundled APK
        shell: bash
        run: |
          APK="winlator-src/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          test "$(stat -c%s "$APK")" -gt 800000000
          cp "$APK" SeongSamgukji-OneTouch-v1.0.apk
          ls -lh SeongSamgukji-OneTouch-v1.0.apk
          sha256sum SeongSamgukji-OneTouch-v1.0.apk

      - name: Upload private build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SeongSamgukji-OneTouch-v1.0
          path: SeongSamgukji-OneTouch-v1.0.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

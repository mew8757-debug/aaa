name: Build Standalone SeongSamgukji APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "standalone/**"
      - ".github/workflows/build-standalone.yml"

concurrency:
  group: seong-standalone
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout customization repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK, NDK and CMake
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;24.0.8215888" "cmake;3.22.1"

      - name: Clone Winlator 11.2 app source
        run: |
          git clone --depth 1 https://github.com/brunodev85/winlator-app.git winlator-src

      - name: Apply standalone game front-end
        shell: bash
        run: |
          cp standalone/SeongSamgukjiActivity.java             winlator-src/app/src/main/java/com/winlator/SeongSamgukjiActivity.java

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest_path = Path("winlator-src/app/src/main/AndroidManifest.xml")
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          ns = "{http://schemas.android.com/apk/res/android}"
          tree = ET.parse(manifest_path)
          root = tree.getroot()
          app = root.find("application")

          app.set(ns+"label", "성삼국지 촉한영걸전")

          for act in app.findall("activity"):
              if act.get(ns+"name") == "com.winlator.MainActivity":
                  for f in list(act.findall("intent-filter")):
                      act.remove(f)
                  act.set(ns+"exported", "false")

          new_act = ET.Element("activity")
          new_act.set(ns+"name", "com.winlator.SeongSamgukjiActivity")
          new_act.set(ns+"theme", "@style/AppThemeDark")
          new_act.set(ns+"exported", "true")
          new_act.set(ns+"screenOrientation", "sensor")
          new_act.set(ns+"configChanges", "keyboard|keyboardHidden|orientation|screenSize|screenLayout|smallestScreenSize|density|navigation")
          filt = ET.SubElement(new_act, "intent-filter")
          action = ET.SubElement(filt, "action")
          action.set(ns+"name", "android.intent.action.MAIN")
          cat = ET.SubElement(filt, "category")
          cat.set(ns+"name", "android.intent.category.LAUNCHER")
          app.insert(0, new_act)

          for prov in app.findall("provider"):
              if prov.get(ns+"name") == "androidx.core.content.FileProvider":
                  prov.set(ns+"authorities", "kr.co.seongsamgukji.standalone.FileProvider")

          tree.write(manifest_path, encoding="utf-8", xml_declaration=True)

          gradle = Path("winlator-src/app/build.gradle")
          s = gradle.read_text()
          s = s.replace("applicationId 'com.winlator'", "applicationId 'kr.co.seongsamgukji.standalone'")
          s = s.replace('versionCode 33', 'versionCode 1')
          s = s.replace('versionName "11.2"', 'versionName "0.2.0"')
          gradle.write_text(s)

          fileutils = Path("winlator-src/app/src/main/java/com/winlator/core/FileUtils.java")
          s = fileutils.read_text()
          s = s.replace('"com.winlator.FileProvider"', '"kr.co.seongsamgukji.standalone.FileProvider"')
          fileutils.write_text(s)
          PY

      - name: Build standalone APK
        working-directory: winlator-src
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          cp winlator-src/app/build/outputs/apk/debug/app-debug.apk             SeongSamgukji-Standalone-v0.2.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SeongSamgukji-Standalone-v0.2
          path: SeongSamgukji-Standalone-v0.2.apk
          if-no-files-found: error

      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view standalone-v0.2 >/dev/null 2>&1; then
            gh release upload standalone-v0.2 SeongSamgukji-Standalone-v0.2.apk --clobber
          else
            gh release create standalone-v0.2 SeongSamgukji-Standalone-v0.2.apk               --title "성삼국지 촉한영걸전 일체형 실행판 v0.2"               --notes "Winlator 11.2 기반 전용 실행판 테스트 빌드입니다. Winlator 앱을 따로 조작할 필요가 없습니다. 첫 실행 시 사용자가 보유한 game1.zip과 game2.zip을 선택해 설치합니다. 게임 원본 데이터는 APK에 포함하지 않습니다."
          fi

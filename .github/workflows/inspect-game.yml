name: Inspect SeongSamgukji Game

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/inspect-game.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download game1
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/573646841" \
            -o game1.zip
          ls -lh game1.zip

      - name: Inspect archive
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile, os, collections, pathlib, struct
          p='game1.zip'
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              print("TOTAL", len(names))
              tops=collections.Counter(n.split('/')[0] for n in names if n)
              print("TOP_LEVEL")
              for k,v in tops.most_common(100):
                  print(v, k)
              print("EXECUTABLES")
              for n in names:
                  if n.lower().endswith(('.exe','.dll','.bat','.cmd','.ini','.cfg')):
                      info=z.getinfo(n)
                      print(info.file_size, n)
              print("ROOT_FILES")
              for n in names:
                  if '/' not in n.rstrip('/'):
                      info=z.getinfo(n)
                      print(info.file_size, n)
          PY

      - name: Extract EXEs and identify PE
        shell: bash
        run: |
          rm -rf exes && mkdir exes
          python3 - <<'PY'
          import zipfile, os
          with zipfile.ZipFile('game1.zip') as z:
              for n in z.namelist():
                  if n.lower().endswith('.exe'):
                      dst='exes/'+os.path.basename(n)
                      with z.open(n) as src, open(dst,'wb') as out:
                          out.write(src.read())
                      print(n,'->',dst)
          PY
          for f in exes/*; do
            echo "=== $f ==="
            file "$f" || true
            sha256sum "$f" || true
            objdump -p "$f" 2>/dev/null | grep -E 'Subsystem|DLL Name|ImageBase|AddressOfEntryPoint|MajorSubsystemVersion|MinorSubsystemVersion' | head -n 80 || true
            strings -a "$f" | grep -Ei 'DirectDraw|Direct3D|d3d|ddraw|mci|avi|ActiveMovie|ekd|ccz|曹操|조조' | head -n 80 || true
          done

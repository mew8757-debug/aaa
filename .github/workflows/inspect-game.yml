name: Inspect Private Game Archives

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/inspect-game.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download private game data
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p game-data
          for PAIR in "573646841 game1.Zip" "573647280 game2.Zip"; do
            set -- $PAIR
            ID="$1"
            NAME="$2"
            curl --fail --location --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${ID}" \
              -o "game-data/${NAME}"
          done

      - name: Inspect archives
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile, os, json
          out = []
          for p in ["game-data/game1.Zip","game-data/game2.Zip"]:
              print("\n###", p)
              with zipfile.ZipFile(p) as z:
                  infos=z.infolist()
                  exes=[i for i in infos if i.filename.lower().endswith(".exe")]
                  dlls=[i for i in infos if i.filename.lower().endswith(".dll")]
                  avis=[i for i in infos if i.filename.lower().endswith(".avi")]
                  print("entries", len(infos))
                  print("EXES")
                  for i in exes:
                      print(i.filename, i.file_size)
                  print("DLLS")
                  for i in dlls[:100]:
                      print(i.filename, i.file_size)
                  print("AVIS")
                  for i in avis[:100]:
                      print(i.filename, i.file_size)
                  roots={}
                  for i in infos:
                      root=i.filename.split("/")[0]
                      roots[root]=roots.get(root,0)+1
                  print("ROOTS", json.dumps(roots, ensure_ascii=False, indent=2))
          PY
